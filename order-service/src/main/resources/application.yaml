spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  config:
    import: optional:nacos:localhost:8848
server:
  port: 8082
powerjob:
  worker:
    app-name: test
    server-address: 127.0.0.1:7700  # PowerJob服务端地址
    protocol: http
    store-strategy: disk
    max-result-length: 4096
    max-lightweight-task-num: 4      # 最大同时运行的轻量级任务数
    max-heavyweight-task-num: 2      # 最大同时运行的重量级任务数